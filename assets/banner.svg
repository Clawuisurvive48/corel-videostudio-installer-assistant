<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120821"/>
      <stop offset="55%" stop-color="#1e1042"/>
      <stop offset="100%" stop-color="#2a1458"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6ec7"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="clip1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6ec7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="clip2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8fd8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)"/>
  <circle cx="1000" cy="90" r="260" fill="url(#glow1)"/>
  <circle cx="120" cy="300" r="220" fill="url(#glow2)"/>

  <!-- faint grid backdrop -->
  <g stroke="#7c5cff" stroke-opacity="0.08">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1100" y1="0" x2="1100" y2="360"/>
  </g>

  <!-- film reel motif top right -->
  <g transform="translate(1040,80)" opacity="0.9">
    <circle r="58" fill="none" stroke="url(#panelGrad)" stroke-width="4"/>
    <circle r="10" fill="#0f0620" stroke="#a855f7" stroke-width="2"/>
    <circle cx="0" cy="-38" r="9" fill="#0f0620" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="33" cy="-19" r="9" fill="#0f0620" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="33" cy="19" r="9" fill="#0f0620" stroke="#ff6ec7" stroke-width="2"/>
    <circle cx="0" cy="38" r="9" fill="#0f0620" stroke="#ff6ec7" stroke-width="2"/>
    <circle cx="-33" cy="19" r="9" fill="#0f0620" stroke="#a855f7" stroke-width="2"/>
    <circle cx="-33" cy="-19" r="9" fill="#0f0620" stroke="#a855f7" stroke-width="2"/>
  </g>

  <!-- play button medallion -->
  <g transform="translate(150,180)">
    <circle r="72" fill="#0f0620" stroke="url(#playGrad)" stroke-width="4"/>
    <circle r="72" fill="url(#glow1)" opacity="0.5"/>
    <polygon points="-22,-34 -22,34 40,0" fill="url(#playGrad)"/>
  </g>

  <!-- timeline tracks -->
  <g transform="translate(60,272)">
    <rect x="0" y="0" width="1080" height="10" rx="5" fill="#2a1a4a"/>
    <rect x="0" y="0" width="230" height="10" rx="5" fill="url(#clip1)"/>
    <rect x="250" y="0" width="180" height="10" rx="5" fill="url(#clip2)"/>
    <rect x="450" y="0" width="260" height="10" rx="5" fill="url(#clip1)"/>
    <rect x="730" y="0" width="200" height="10" rx="5" fill="url(#clip2)"/>
    <rect x="950" y="0" width="130" height="10" rx="5" fill="url(#clip1)"/>

    <rect x="0" y="20" width="1080" height="7" rx="3.5" fill="#241640"/>
    <rect x="60" y="20" width="150" height="7" rx="3.5" fill="#ff6ec7" opacity="0.6"/>
    <rect x="330" y="20" width="220" height="7" rx="3.5" fill="#38bdf8" opacity="0.55"/>
    <rect x="620" y="20" width="180" height="7" rx="3.5" fill="#a855f7" opacity="0.6"/>
    <rect x="880" y="20" width="150" height="7" rx="3.5" fill="#ff6ec7" opacity="0.5"/>

    <line x1="410" y1="-10" x2="410" y2="40" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <polygon points="410,-10 402,-20 418,-20" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="58" fill="#ffffff">
    <tspan x="60" y="150" textLength="1030" lengthAdjust="spacingAndGlyphs">Corel VideoStudio Full Version</tspan>
    <tspan x="60" y="212" textLength="330" lengthAdjust="spacingAndGlyphs">Download</tspan>
  </text>

  <!-- tagline -->
  <text x="60" y="248" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#c9b6ff" textLength="330" lengthAdjust="spacingAndGlyphs">Reads installer package</text>
</svg>